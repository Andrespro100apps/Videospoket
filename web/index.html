<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeScript HTML App</title>
  <style>
    html, body {
        margin: 0;
        overflow: hidden;
    }
    canvas {
        width: 100vw;
        height: 100vh;
        display: block;
    }
  .control-panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 320px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    backdrop-filter: blur(6px);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    font-family: 'Segoe UI', system-ui, sans-serif;
    z-index: 10;
    display: none; /* Hidden by default, shown via useAdmin() */
  }

  .control-panel.admin-mode {
    display: block;
  }

  .control-panel h2 {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .control-panel h3 {
    margin: 16px 0 8px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0.85;
  }

  .group-title {
    margin: 12px 0 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .motion-group {
    margin-bottom: 12px;
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }

  .control-button {
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  .control-button:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-1px);
  }

  .control-button:active {
    background: rgba(255, 255, 255, 0.24);
    transform: translateY(0);
  }

  .empty-state {
    margin: 0;
    font-size: 13px;
    opacity: 0.7;
  }

  @media (max-width: 768px) {
    .control-panel {
      left: 50%;
      right: auto;
      top: auto;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100vw - 32px);
      max-height: 40vh;
    }
  }
  </style>
  <!-- Live2DCubismCore script -->
  <script src = "./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script type="module" crossorigin src="./assets/index-MD5knaY7.js"></script>
</head>
<body>
  <div id="control-panel" class="control-panel">
    <h2>Aiko Live2D Controls</h2>
    <div class="panel-section">
      <h3>Expressions</h3>
      <p id="expression-empty" class="empty-state" hidden>No expressions detected.</p>
      <div id="expression-buttons" class="button-grid"></div>
    </div>
    <div class="panel-section">
      <h3>Motions</h3>
      <p id="motion-empty" class="empty-state" hidden>No motions detected.</p>
      <div id="motion-buttons"></div>
    </div>
    <div class="panel-section" id="split-at-section" style="display:none;">
      <h3>Split At Debug</h3>
      <div id="split-at-controls"></div>
    </div>
    <div class="panel-section" id="texture-debug-section">
      <h3>Texture Debug</h3>
      <p style="font-size:11px;opacity:0.6;margin:0 0 8px;">Click to toggle load/unload per texture slot</p>
      <div id="texture-debug-buttons"></div>
    </div>
  </div>
</body>
</html>
